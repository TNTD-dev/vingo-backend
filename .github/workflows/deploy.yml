name: deploy

# merge main → build image → GHCR → staging
# tag release-v* → production
on:
  push:
    branches: [main]
    tags: ['release-v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: [self-hosted, linux, x64, aws]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Máy runner AWS chưa có plugin buildx; action này tự tải về.
      - uses: docker/setup-buildx-action@v3
        with:
          version: latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tntd-dev/vingo-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/tntd-dev/vingo-backend:${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || 'staging' }}

  deploy:
    needs: image
    runs-on: [self-hosted, linux, x64, aws]
    environment: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || 'staging' }}
    steps:
      - name: SSH vào server, pull và chạy lại
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$HOST" ]; then echo "Chưa cấu hình DEPLOY_HOST cho environment này, bỏ qua deploy."; exit 0; fi
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          # api khởi động mất ~60s trên máy 2 GB, nên thử health tới khi UP (tối đa 3 phút)
          # thay vì đợi một khoảng cố định.
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" "TAG=$TAG bash -s" <<'EOF'
          set -e
          cd ~/vingo
          export IMAGE_TAG="$TAG"
          docker compose pull
          docker compose up -d
          DOMAIN=$(grep '^DOMAIN=' .env | cut -d= -f2)
          # Hạn chót tính theo đồng hồ (gồm cả thời gian curl lẫn sleep); mỗi lần curl tối đa 10s
          # để một request treo không giữ job mãi.
          start=$SECONDS
          deadline=$((start + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --connect-timeout 5 --max-time 10 "https://$DOMAIN/actuator/health"; then
              echo; echo "api UP sau $((SECONDS - start))s"; exit 0
            fi
            sleep 5
          done
          echo "api chưa UP sau 3 phút"
          docker compose ps
          docker compose logs --tail 50 api
          exit 1
          EOF
