name: deploy

# merge main → build image → GHCR → staging
# tag release-v* → production
on:
  push:
    branches: [main]
    tags: ['release-v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: [self-hosted, linux, x64, aws]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tntd-dev/vingo-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/tntd-dev/vingo-backend:${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || 'staging' }}

  deploy:
    needs: image
    runs-on: [self-hosted, linux, x64, aws]
    environment: ${{ startsWith(github.ref, 'refs/tags/release-v') && 'production' || 'staging' }}
    steps:
      - name: SSH vào server, pull và chạy lại
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$HOST" ]; then echo "Chưa cấu hình DEPLOY_HOST cho environment này, bỏ qua deploy."; exit 0; fi
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd ~/vingo && IMAGE_TAG=$TAG docker compose pull && IMAGE_TAG=$TAG docker compose up -d && sleep 20 && curl -fsS https://\$(grep ^DOMAIN= .env | cut -d= -f2)/actuator/health"
