name: codeql

# Quét bảo mật CodeQL cho PR và push vào develop / main, thêm 1 lần mỗi tuần.
# Chạy trên runner của GitHub (repo public miễn phí), không dùng runner AWS.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: '0 2 * * 1'   # 9h sáng thứ Hai giờ Việt Nam

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: quét mã nguồn trực tiếp, không cần build bằng Maven/JDK 25.
        language: [java-kotlin, actions, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
