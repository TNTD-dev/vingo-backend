# Postgres 18 + Redis cho máy dev: docker compose -f deploy/compose.dev.yaml up -d
name: vingo-backend

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vingo
      POSTGRES_USER: vingo
      POSTGRES_PASSWORD: vingo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vingo -d vingo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
