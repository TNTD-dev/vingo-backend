# Postgres 18 + Redis cho máy dev: docker compose -f deploy/compose.dev.yaml up -d
name: vingo-backend

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vingo
      POSTGRES_USER: vingo
      POSTGRES_PASSWORD: vingo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vingo -d vingo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: vingo-local
      RUSTFS_SECRET_KEY: vingo-local-private-storage
    volumes:
      - rules_objects:/data
  venue-documents:
    build: ./venue-documents
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: vingo-local
      S3_SECRET_KEY: vingo-local-private-storage
      INTERNAL_KEY: local-venue-documents-key
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      - minio

volumes:
  rules_objects:
  pgdata:
