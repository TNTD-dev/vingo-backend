        venue_id: { type: string, format: uuid }
        layout_type: { $ref: '#/components/schemas/LayoutType' }
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminLayoutTreeVersion' }
        next_cursor: { type: [string, 'null'] }
    AdminLayoutTreeVersion:
      type: object
      required: [id, name, version, status, zones]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer, format: int64 }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        overview_id: { type: string, format: uuid }
        overview_name: { type: string }
        overview_status: { type: string }
        published_at: { type: string, format: date-time }
        zones:
          type: array
          items: { $ref: '#/components/schemas/AdminLayoutTreeZone' }
    AdminLayoutTreeZone:
      type: object
      required: [id, code, name, kind, capacity]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [SEATED, STANDING] }
