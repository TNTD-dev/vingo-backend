        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        city: { type: string, maxLength: 100 }
        city_name: { type: string, description: Tên hiển thị của thành phố }
        district: { type: string }
        lat: { type: number }
        lng: { type: number }
        rules: { type: [string, 'null'], description: Nội quy sân }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        layout_count: { type: integer, format: int64 }
        published_layout_count: { type: integer, format: int64 }
        draft_layout_count: { type: integer, format: int64 }
    VenueInput:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string, maxLength: 100 }
        district: { type: string }
        lat: { type: number }
        lng: { type: number }
        rules: { type: [string, 'null'] }
    VenueCreateInput:
      allOf:
        - $ref: '#/components/schemas/VenueInput'
        - type: object
          required: [name, address, city]
    SeatLayout:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, description: Tên cấu hình; các phiên bản được phép trùng tên. }
        venue_id: { type: string, format: uuid }
        overview_id: { type: [string, 'null'], format: uuid }
        layout_type: { $ref: '#/components/schemas/LayoutType' }
        zone_count: { type: integer }
