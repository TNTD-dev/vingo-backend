openapi: 3.1.0
info:
  title: Vingo Booking API
  version: 1.0.0
  description: |
    API của hệ thống đặt vé sự kiện qua chat Vingo.

    Quy ước chung
    - Base URL: /api/v1. JSON UTF-8.
    - Auth: `Authorization: Bearer <access_token>` (JWT 15 phút). Refresh token xoay vòng qua /auth/refresh.
    - Vai trò: BUYER, ADMIN. Endpoint /admin/* chỉ cho ADMIN.
    - Tiền là số nguyên VND. Thời gian ISO 8601 UTC.
    - Lỗi trả `application/problem+json` (RFC 9457) kèm trường `code`.
    - `Idempotency-Key` (UUID) bắt buộc với các thao tác giữ ghế, tạo thanh toán, xử lý đơn lỗi (resolve-review).
      Cùng key + cùng body → trả lại kết quả cũ. Cùng key + khác body → 409 IDEMPOTENCY_CONFLICT.
    - Phân trang bằng cursor: `?cursor=&limit=` → `{ data, next_cursor }`.
    - Agent tool gọi chính các endpoint này bằng token của người dùng; không có API riêng cho agent.
servers:
  - url: https://api.vingo.example/api/v1
tags:
  - name: Auth
  - name: Me
  - name: Realtime
  - name: Search
  - name: Booking
  - name: Payment
  - name: Tickets
  - name: Check-in
  - name: Admin Catalog
  - name: Admin Operations
  - name: Admin Reports
security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ Auth
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Đăng ký, tạo user UNVERIFIED và gửi OTP email
      description: Tạo tài khoản bằng email. Số điện thoại được lưu làm thông tin liên hệ và có thể dùng chung.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đã gửi OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email đã tồn tại (EMAIL_TAKEN)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 409, code: EMAIL_TAKEN }
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Xác thực OTP, kích hoạt tài khoản và cấp token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_session_id, otp]
              properties:
                otp_session_id: { type: string, format: uuid }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          description: OTP sai hoặc hết hạn (OTP_INVALID, OTP_EXPIRED, OTP_TOO_MANY_ATTEMPTS)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/otp/resend:
    post:
      operationId: resendOtp
      tags: [Auth]
      summary: Gửi lại OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_session_id]
              properties:
                otp_session_id: { type: string, format: uuid }
      description: Gửi lại thành công trả phiên mới và vô hiệu phiên cũ. Dùng otp_session_id mới để xác minh. Phiên sai trả OTP_INVALID, vượt cooldown hoặc hạn mức trả RATE_LIMITED, gửi email lỗi trả SERVICE_UNAVAILABLE.
      responses:
        '202':
          description: Đã gửi lại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSession' }
        '400':
          description: Phiên OTP không hợp lệ hoặc đã dùng.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Phiên OTP không hợp lệ, status: 400, code: OTP_INVALID }
        '503':
          description: Dịch vụ gửi email tạm thời không khả dụng.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Lỗi gửi email, status: 503, code: SERVICE_UNAVAILABLE }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập bằng email và mật khẩu
      description: |
        Tra tài khoản theo email, không phân biệt hoa thường. Định danh không phải email hoặc sai mật khẩu đều trả 401 INVALID_CREDENTIALS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email đăng nhập }
                password: { type: string, format: password }
                device: { type: string, description: Tên thiết bị để quản lý phiên }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Sai thông tin (INVALID_CREDENTIALS)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: Tài khoản bị khoá tạm vì sai nhiều lần (ACCOUNT_LOCKED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/google:
    post:
      operationId: loginWithGoogle
      tags: [Auth]
      summary: Đăng nhập bằng Google id_token (tạo user ACTIVE nếu chưa có)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: startGoogleLogin
      tags: [Auth]
      summary: Bắt đầu đăng nhập Google
      description: Mở đường dẫn bằng trình duyệt để chuyển tới Google. Google sẽ gọi callback đã đăng ký.
      security: []
      responses:
        '302': { description: Chuyển hướng tới Google }
        '404': { $ref: '#/components/responses/GoogleLoginDisabled' }
        '429':
          description: Vượt giới hạn bắt đầu đăng nhập Google theo IP
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Gọi quá nhanh, status: 429, code: RATE_LIMITED, detail: Thử lại sau 20 giây }
        '503':
          description: Kho giới hạn tần suất tạm thời không khả dụng
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Dịch vụ tạm thời không khả dụng, status: 503, code: SERVICE_UNAVAILABLE, detail: Tạm thời không thể bắt đầu đăng nhập Google }
  /auth/oauth2/callback/google:
    get:
      operationId: completeGoogleLogin
      tags: [Auth]
      summary: Nhận callback từ Google
      description: Spring Security xử lý callback. Thành công đặt cookie refresh HttpOnly và chuyển về web với google_login=created hoặc google_login=success. Thất bại chuyển về web với google_login=failed hoặc google_login=email_taken.
      security: []
      responses:
        '302': { description: Chuyển hướng về web }
        '404': { $ref: '#/components/responses/GoogleLoginDisabled' }
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Cấp access token và xoay vòng refresh token
      description: Trình duyệt gửi cookie refresh và Origin của web. Client khác có thể gửi refresh_token trong JSON. Với cookie, refresh token mới chỉ được gửi qua Set-Cookie.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResult' }
        '400':
          description: Body JSON thiếu refresh_token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Dữ liệu không hợp lệ, status: 400, code: VALIDATION_ERROR, detail: Có trường không hợp lệ }
        '401':
          description: Thiếu refresh token hoặc refresh token không hợp lệ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Chưa đăng nhập, status: 401, code: UNAUTHORIZED, detail: Refresh token không hợp lệ hoặc đã hết hạn }
        '403':
          description: Origin gửi cookie refresh không được phép
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Không có quyền, status: 403, code: FORBIDDEN, detail: Origin không được phép làm mới phiên }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Đăng xuất phiên hiện tại hoặc tất cả thiết bị
      description: Thu hồi refresh token của phiên trong access token, hoặc tất cả phiên của user. Xoá cookie refresh trên trình duyệt.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices: { type: boolean, default: false }
      responses:
        '204': { description: Đã thu hồi phiên }
        '401':
          description: Thiếu hoặc sai bearer access token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Chưa đăng nhập, status: 401, code: UNAUTHORIZED, detail: Thiếu hoặc sai access token }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Yêu cầu OTP đặt lại mật khẩu (luôn trả 202 để không lộ email tồn tại)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Nếu email tồn tại, OTP đã được gửi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSession' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Đặt mật khẩu mới bằng OTP, thu hồi mọi phiên
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_session_id, otp, new_password]
              properties:
                otp_session_id: { type: string, format: uuid }
                otp: { type: string, pattern: '^[0-9]{6}$' }
                new_password: { type: string, minLength: 8 }
      responses:
        '204': { description: Đã đổi mật khẩu }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ Me
  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: Thông tin tài khoản hiện tại
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      operationId: updateMe
      tags: [Me]
      summary: Sửa tên, số điện thoại hoặc đổi mật khẩu
      description: Cập nhật hồ sơ của tài khoản hiện tại. Số điện thoại liên hệ có thể trùng với tài khoản khác.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteMe
      tags: [Me]
      summary: Xoá tài khoản (soft-delete) và thu hồi mọi phiên
      responses:
        '204': { description: Đã xoá }
        '409':
          description: Không thể xóa ADMIN hoạt động cuối cùng (ACTION_STATE_INVALID).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Trạng thái không hợp lệ, status: 409, code: ACTION_STATE_INVALID, detail: Không thể xóa ADMIN hoạt động cuối cùng. }
  /me/stream:
    get:
      operationId: streamMyEvents
      tags: [Realtime]
      summary: Server-Sent Events cho người dùng hiện tại
      description: |
        Sự kiện: order.held, order.paid, order.expired, order.needs_review, payment.failed,
        ticket.issued. Chỉ nhận sự kiện của chính người dùng đang đăng nhập.
        Gửi header Authorization: Bearer <access_token>; trên trình duyệt dùng fetch vì EventSource
        không gửi được header Authorization. Không đưa token lên query string.
        Nối lại kèm header Last-Event-ID để phát lại sự kiện trong cửa sổ 5 phút, có độ lùi 10 giây:
        sự kiện có thể trùng, client tự khử trùng theo id; không phát lại chính id đã gửi trong header.
        Last-Event-ID hỏng, không phải UUID, không tồn tại, của người khác hoặc quá 5 phút
        đều không gây lỗi: phát lại toàn bộ cửa sổ 5 phút của chính người dùng.
        Không gửi Last-Event-ID thì không phát lại (sự kiện commit sát lúc kết nối vẫn có thể tới);
        client mở stream trước rồi mới tải trạng thái hiện tại bằng REST.
        Server gửi SSE comment ping khoảng mỗi 20 giây để giữ kết nối.
        Stream đóng khi token hết hạn hoặc khi mở quá 5 kết nối cùng user (đóng kết nối cũ nhất);
        client nối lại, dùng token mới nếu token đã hết hạn.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Id sự kiện cuối client đã nhận.
          schema: { type: string }
      responses:
        '200':
          description: Luồng SSE
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StreamEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Search
  /events:
    get:
      operationId: searchEvents
      tags: [Search]
      summary: Tìm kiếm sự kiện đã PUBLISHED
      description: |
        Gọi khi người dùng muốn tìm sự kiện theo từ khoá, loại, thành phố, khoảng thời gian hoặc khoảng giá. Trả danh sách `EventSummary` phân trang bằng cursor.

        Phạm vi kết quả: chỉ sự kiện PUBLISHED còn ít nhất một suất SCHEDULED chưa diễn ra. Tìm theo `q` chịu được gõ không dấu và gõ sai chính tả. Nếu không sự kiện nào khớp đủ mọi từ trong `q`, trả các sự kiện khớp một phần, xếp theo độ khớp.
        `venue_name`, `city`, `first_starts_at` lấy từ suất sớm nhất thoả bộ lọc. `price_from` là giá thấp nhất trong các hạng vé đã gán khu.

        Sắp xếp (`sort`): không truyền thì có `q` dùng `relevance`, không có `q` dùng `starts_at`. `relevance` mà không có `q` trả 400.
        `popularity` = tổng vé đã bán của các suất sắp tới.

        Cursor gắn với bộ lọc và `sort` đã dùng khi sinh ra nó. Dùng cursor với bộ lọc hoặc sort khác trả 400 `VALIDATION_ERROR`.

        `city` nhận mã hoặc tên tỉnh/thành trong dữ liệu sân. `HN`, `HCM`, `DN` và tên tương ứng được lọc chung với dữ liệu cũ.

        Ví dụ lỗi 400:
        ```json
        { "title": "Tham số không hợp lệ", "status": 400, "code": "VALIDATION_ERROR",
          "detail": "sort=relevance cần có tham số q",
          "errors": [ { "field": "sort", "message": "relevance chỉ dùng khi có q" } ] }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters:
        - name: q
          in: query
          description: "Từ khoá tìm trên tên sự kiện, nghệ sĩ hoặc đội, mô tả, tên sân và tên thành phố của các suất còn bán (suất đã huỷ, đã qua và sân ngừng dùng không tính). Có dấu hay không dấu đều khớp ('Mỹ Đình' = 'my dinh', 'Hà Nội' = 'ha noi'), gõ dở một đoạn đầu từ vẫn ra, gõ sai nhẹ tên sự kiện vẫn ra. Thứ tự xếp: khớp tên sự kiện trên khớp sân/thành phố, khớp sân/thành phố trên khớp mô tả. Từ khoá chỉ 1 đến 2 ký tự chỉ khớp đầu từ (ví dụ 'sk' ra 'Sky'), không dò gần đúng nên 'x' không ra sự kiện nào chỉ vì giống chữ. Muốn lọc chính xác theo loại sự kiện, thành phố hay thời gian thì dùng `category`, `city`, `from`/`to` thay vì đưa vào `q`. Ví dụ: người dùng nói 'concert Sơn Tùng ở Sài Gòn' → `q=Sơn Tùng`, `category=CONCERT`, `city=HCM`; người dùng nói 'sự kiện ở sân Mỹ Đình' → `q=Mỹ Đình`."
          schema: { type: string }
          examples:
            artist: { summary: "Tên nghệ sĩ (không dấu vẫn được)", value: son tung }
            venue: { summary: Tên sân, value: Mỹ Đình }
            city: { summary: Thành phố, value: Hà Nội }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/EventCategory' } }
        - { name: city, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: price_min, in: query, schema: { type: integer, format: int64 } }
        - { name: price_max, in: query, schema: { type: integer, format: int64 } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, starts_at, price, popularity] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /events/{event_id}:
    get:
      operationId: getEvent
      tags: [Search]
      summary: Chi tiết sự kiện, địa điểm và bảng giá
      description: |
        Gọi khi đã biết `event_id` (lấy từ `searchEvents`) và cần mô tả, địa điểm, bảng giá các hạng vé và các suất. Trả `EventDetail`.
        Sự kiện không tồn tại hoặc chưa PUBLISHED trả 404.

        Ví dụ lỗi 404:
        ```json
        { "title": "Không tìm thấy sự kiện", "status": 404, "code": "NOT_FOUND", "detail": "Sự kiện không tồn tại" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /events/{event_id}/showtimes:
    get:
      operationId: listEventShowtimes
      tags: [Search]
      summary: Danh sách suất của sự kiện
      description: |
        Gọi khi cần liệt kê các suất của một sự kiện để người dùng chọn ngày giờ. Trả `data` là danh sách `Showtime` kèm `status` tính theo thời điểm gọi.
        Sự kiện không tồn tại trả 404.

        Ví dụ lỗi 404:
        ```json
        { "title": "Không tìm thấy sự kiện", "status": 404, "code": "NOT_FOUND", "detail": "Sự kiện không tồn tại" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Showtime' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /showtimes/{showtime_id}/seatmap:
    get:
      operationId: getSeatmap
      tags: [Search]
      summary: Sơ đồ ghế theo suất kèm hạng, giá và trạng thái
      description: |
        Gọi khi người dùng cần chọn ghế cụ thể. Trả sơ đồ ghế của suất kèm hạng vé, giá và trạng thái từng ghế. Có thể cache vài giây.

        Không truyền `zone_id` thì trả mọi khu; truyền `zone_id` thì chỉ trả khu đó. `zone_id` không thuộc sơ đồ của suất trả 404.
        Ghế HELD đã quá `held_until` được trả là AVAILABLE. Ghế thiếu dữ liệu trạng thái được trả là BLOCKED.

        Gợi ý cho agent: gọi `getAvailability` trước để biết khu nào còn chỗ, rồi gọi seatmap theo từng khu bằng `zone_id` để giảm dữ liệu.

        Ví dụ lỗi 404 (suất hoặc khu không tồn tại):
        ```json
        { "title": "Không tìm thấy khu", "status": 404, "code": "NOT_FOUND", "detail": "zone_id không thuộc sơ đồ của suất" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
        - { name: zone_id, in: query, required: false, description: 'Chỉ trả khu này; bỏ trống để trả mọi khu', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /showtimes/{showtime_id}/seatmap.svg:
    get:
      operationId: getSeatmapSvg
      tags: [Search]
      summary: Ảnh SVG sơ đồ sân của suất
      description: |
        Gọi khi giao diện cần vẽ sơ đồ sân cho trang chọn ghế. Trả SVG đã chuẩn hóa của sơ đồ sân gắn với suất, dùng cùng dữ liệu ghế và trạng thái của `getSeatmap`/`getAvailability`: nhóm khu trong SVG mang mã khu, ghép với `zones[].name`; ghế trong khu ghép theo `row` và `number`.
        Chỉ trả khi suất không phải DRAFT, sự kiện đang PUBLISHED và sơ đồ đã PUBLISHED. Admin có thể đổi sơ đồ của suất trước giờ mở bán, nên phản hồi có `Cache-Control: no-cache` kèm `ETag`: trình duyệt dùng lại bản đã tải sau khi hỏi lại bằng `If-None-Match` (server trả 304 nếu SVG không đổi).

        Ví dụ lỗi 404 (suất không tồn tại, suất DRAFT, sự kiện chưa PUBLISHED, hoặc sơ đồ không có SVG):
        ```json
        { "title": "Không tìm thấy suất", "status": 404, "code": "NOT_FOUND", "detail": "Suất không tồn tại" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
      responses:
        '200':
          description: Nội dung SVG
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /showtimes/{showtime_id}/availability:
    get:
      operationId: getAvailability
      tags: [Search]
      summary: Số chỗ còn theo khu và hạng vé
      description: |
        Gọi khi cần biết suất còn chỗ không và khu/hạng nào còn bao nhiêu chỗ, trước khi chọn ghế hoặc tạo hold. Nhẹ hơn `getSeatmap`.
        Trả `sold_out` và danh sách khu kèm hạng vé. Suất không tồn tại trả 404.

        Ví dụ lỗi 404:
        ```json
        { "title": "Không tìm thấy suất", "status": 404, "code": "NOT_FOUND", "detail": "Suất không tồn tại" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters: [ { $ref: '#/components/parameters/ShowtimeId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  showtime_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/ShowtimeStatus' }
                  sold_out: { type: boolean }
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        zone_id: { type: string, format: uuid }
                        code: { type: string, description: Mã khu để liên kết với SVG. }
                        name: { type: string, description: Tên khu hiển thị theo sự kiện. }
                        tier: { $ref: '#/components/schemas/PriceTier' }
                        seats_left: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ------------------------------------------------------------------ Booking
  /showtimes/{showtime_id}/holds:
    post:
      operationId: holdSeats
      tags: [Booking]
      summary: Giữ ghế 10 phút và tạo đơn PENDING (tất cả hoặc không)
      description: |
        Khu ngồi gửi seat_ids (ghế đôi tự giữ kèm ghế cặp). Khu đứng gửi zone_id + quantity.
        JWT yêu cầu tài khoản đã xác minh email.
        Đơn PENDING cũ đã quá hạn của khách cho suất này sẽ được đóng trước.
        Nếu khách đã có đơn PENDING còn hạn cho suất này → 409 ORDER_STATE_INVALID; muốn đổi ghế thì huỷ rồi giữ lại.
        Vượt max_tickets_per_order của sự kiện (tính cả ghế cặp) → 422 MAX_TICKETS_EXCEEDED.
        Suất không tồn tại hoặc DRAFT → 404 NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldRequest' }
      responses:
        '201':
          description: Đã giữ chỗ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            SEAT_TAKEN, NOT_ENOUGH_STOCK, SHOWTIME_NOT_ON_SALE, ORDER_STATE_INVALID, IDEMPOTENCY_CONFLICT.
            taken_seat_ids: ghế vừa bị giữ/bán.
            suggested_seat_ids: gợi ý ghế cùng khu, cùng số lượng, đang trống.
            seats_left: số chỗ còn lại của khu đứng (integer).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                seatTaken:
                  value:
                    type: https://vingo.example/errors/seat-taken
                    title: Ghế vừa có người giữ
                    status: 409
                    code: SEAT_TAKEN
                    taken_seat_ids: ['5b0d...']
                    suggested_seat_ids: ['9a1c...', '9a1d...']
                notEnoughStock:
                  value:
                    type: https://vingo.example/errors/not-enough-stock
                    title: Khu đứng không đủ chỗ
                    status: 409
                    code: NOT_ENOUGH_STOCK
                    seats_left: 2
        '422':
          description: Vượt số vé tối đa mỗi đơn (MAX_TICKETS_EXCEEDED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Vượt số vé tối đa mỗi đơn, status: 422, code: MAX_TICKETS_EXCEEDED }
        '429': { $ref: '#/components/responses/RateLimited' }
  /orders:
    get:
      operationId: listMyOrders
      tags: [Booking]
      summary: Danh sách đơn của tôi
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
  /orders/{order_id}:
    get:
      operationId: getOrder
      tags: [Booking]
      summary: Chi tiết đơn (chỉ chủ đơn)
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      tags: [Booking]
      summary: Huỷ đơn PENDING và nhả ghế (đổi ghế = huỷ + giữ lại)
      description: Đơn không tồn tại hoặc của người khác → 404 NOT_FOUND.
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: Đơn đã chuyển CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ORDER_STATE_INVALID (đơn đã PAID hoặc EXPIRED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Payment
  /orders/{order_id}/payments:
    post:
      operationId: createPayment
      tags: [Payment]
      summary: Tạo hoặc tái dùng payment_intent OPEN và trả link VNPay
      description: |
        Điều kiện: order PENDING, expires_at > now. Body cần có buyer (họ tên, email, SĐT) nếu đơn chưa có; thiếu thì 422 PROFILE_REQUIRED.
        Thông tin người mua ghi lên đơn (ticket_order.buyer_*); ghi đè được khi đơn còn PENDING.
        payment_url ký HMAC-SHA512, vnp_Amount = amount × 100, hết hạn cùng order.expires_at.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [VNPAYQR, ATM, INTCARD], description: 'Gợi ý phương thức, có thể bỏ trống' }
                buyer: { $ref: '#/components/schemas/Buyer' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409':
          description: HOLD_EXPIRED, ORDER_STATE_INVALID, IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: PROFILE_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /orders/{order_id}/payment:
    get:
      operationId: getPayment
      tags: [Payment]
      summary: Trạng thái lần thanh toán gần nhất của đơn
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/vnpay/ipn:
    get:
      operationId: handleVnpayIpn
      tags: [Payment]
      summary: Webhook IPN của VNPay để xác nhận thanh toán
      description: |
        Kiểm vnp_SecureHash trước mọi xử lý. Lưu payment_gateway_log (append-only, raw).
        Xử lý idempotent theo payment. Luôn trả HTTP 200 với RspCode:
        00 thành công · 01 không tìm thấy giao dịch · 02 đã xử lý · 04 sai số tiền · 97 sai chữ ký · 99 lỗi hệ thống (VNPay gọi lại).
      security: []
      parameters:
        - { name: vnp_TxnRef, in: query, required: true, schema: { type: string } }
        - { name: vnp_Amount, in: query, required: false, schema: { type: string } }
        - { name: vnp_ResponseCode, in: query, required: true, schema: { type: string } }
        - { name: vnp_TransactionStatus, in: query, required: true, schema: { type: string } }
        - { name: vnp_TransactionNo, in: query, schema: { type: string } }
        - { name: vnp_SecureHash, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Phản hồi cho VNPay
          content:
            application/json:
              schema:
                type: object
                required: [RspCode, Message]
                properties:
                  RspCode: { type: string, enum: ['00', '01', '02', '04', '97', '99'] }
                  Message: { type: string }
  /payments/vnpay/return:
    get:
      operationId: handleVnpayReturn
      tags: [Payment]
      summary: Trang VNPay chuyển khách về; chỉ để hiển thị, không chốt bán
      description: Khi chưa có IPN, trang return kích hoạt querydr và chuyển hướng về đơn hàng. IPN và kết quả querydr đều có thể xác nhận thanh toán; trang return không tự chốt bán.
      security: []
      responses:
        '302': { description: Chuyển về web Vingo }

  # ------------------------------------------------------------------ Tickets
  /tickets:
    get:
      operationId: listMyTickets
      tags: [Tickets]
      summary: Vé của tôi
      parameters:
        - { name: when, in: query, schema: { type: string, enum: [upcoming, past], default: upcoming } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TicketStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Ticket' }
  /tickets/{ticket_id}:
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Chi tiết vé; qr_token chỉ có khi status = ISSUED
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets/{ticket_id}/qr.png:
    get:
      operationId: getTicketQr
      tags: [Tickets]
      summary: Ảnh mã QR vào cổng
      description: |
        Chỉ chủ vé ISSUED được lấy ảnh PNG 320x320, nội dung là qr_token hiện tại.
        Trả Cache-Control: no-store vì ảnh chứa token vào cổng; reissue-qr làm token trong ảnh cũ mất hiệu lực.
        QR có lề 2 module và mức sửa lỗi M.
        Vé không tồn tại hoặc không thuộc người gọi trả 404 NOT_FOUND, kể cả ADMIN không phải chủ vé.
        Vé USED trả 409 TICKET_USED; vé VOID trả 409 TICKET_NOT_VALID. Chưa đăng nhập trả 401 UNAUTHORIZED.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Vé đã dùng (TICKET_USED) hoặc đã vô hiệu (TICKET_NOT_VALID)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /tickets/{ticket_id}/resend:
    post:
      operationId: resendMyTicket
      tags: [Tickets]
      summary: Gửi lại vé tới email trên đơn (rate limit 3 lần / giờ)
      description: |
        Chỉ chủ vé được gửi lại; vé không tồn tại hoặc khác chủ đều trả 404.
        Khoá vé trước khi kiểm trạng thái; chỉ vé ISSUED được gửi. USED → TICKET_USED,
        VOID → TICKET_NOT_VALID; đơn không có buyer_email → ORDER_STATE_INVALID.
        Giới hạn 3 lần/giờ/user (RATE_LIMITED); ghi email vé qua outbox, không ghi audit_log.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '202': { description: Đã đưa vào hàng đợi gửi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TICKET_USED, TICKET_NOT_VALID hoặc ORDER_STATE_INVALID khi đơn không có email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                used:
                  value: { title: Vé đã sử dụng, status: 409, code: TICKET_USED, detail: Chỉ gửi lại vé ISSUED. }
                void:
                  value: { title: Vé không còn hiệu lực, status: 409, code: TICKET_NOT_VALID, detail: Vé đã bị vô hiệu. }
                noEmail:
                  value: { title: Đơn không có email, status: 409, code: ORDER_STATE_INVALID, detail: Đơn không có buyer_email để gửi vé. }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ------------------------------------------------------------------ Check-in
  /checkins:
    post:
      operationId: checkIn
      tags: [Check-in]
      summary: Quét QR tại cổng
      description: Chỉ ADMIN (sau này có thể thêm vai trò nhân viên soát vé). Xác minh QR và khóa vé theo ID; ISSUED và đúng suất → USED. Mọi lần quét đều ghi checkin; QR không tồn tại → 409 INVALID_QR, ghi nhận lần quét.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, showtime_id]
              properties:
                qr_token: { type: string }
                showtime_id: { type: string, format: uuid }
                gate: { type: string }
      responses:
        '200':
          description: Hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
        '409':
          description: |
            Từ chối quét, body là CheckinResult (không phải Problem):
            ALREADY_USED: vé đã quét trước đó, first_used_at là lần quét đầu.
            TICKET_VOID: vé đã huỷ.
            WRONG_SHOWTIME: vé thuộc suất khác, trạng thái vé không đổi.
            INVALID_QR: QR sai định dạng, sai chữ ký HMAC hoặc không tồn tại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
              examples:
                alreadyUsed:
                  value:
                    result: ALREADY_USED
                    ticket_code: K7M2QX9P
                    zone: VIP
                    row: B
                    number: 12
                    scanned_at: '2026-12-20T12:31:05Z'
                    first_used_at: '2026-12-20T12:05:41Z'
                ticketVoid:
                  value:
                    result: TICKET_VOID
                    ticket_code: H3WR8TNA
                    zone: GA
                    row: null
                    number: null
                    scanned_at: '2026-12-20T12:31:05Z'
                    first_used_at: null
                wrongShowtime:
                  value:
                    result: WRONG_SHOWTIME
                    ticket_code: P9DXE4LC
                    zone: VIP
                    row: C
                    number: 3
                    scanned_at: '2026-12-20T12:31:05Z'
                    first_used_at: null
                invalidQr:
                  value:
                    result: INVALID_QR
                    ticket_code: null
                    zone: null
                    row: null
                    number: null
                    scanned_at: '2026-12-20T12:31:05Z'
                    first_used_at: null
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/showtimes/{showtime_id}/checkins:
    get:
      operationId: listShowtimeCheckins
      tags: [Check-in]
      summary: Lịch sử quét theo suất
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CheckinResult' }

  # ------------------------------------------------------------------ Admin Catalog
  /admin/users/statistics:
    get:
      operationId: adminUserStatistics
      tags: [Admin Accounts]
      summary: Thống kê trạng thái người dùng
      description: 'Chỉ ADMIN. Đếm trên toàn bộ tài khoản, không phụ thuộc trang danh sách. ACTIVE/LOCKED/UNVERIFIED/DELETED được tính từ thông tin xác minh, khoá và xoá; không suy số người online từ ACTIVE.'
      responses:
        '200':
          description: Số tài khoản theo trạng thái
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserStatistics' }
              example: { total: 10, active: 8, locked: 1, unverified: 1, deleted: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/export:
    get:
      operationId: exportAdminUsers
      tags: [Admin Accounts]
      summary: Xuất danh sách người dùng
      description: 'Chỉ ADMIN. CSV UTF-8 theo bộ lọc, tối đa 10000 tài khoản; vượt giới hạn trả 413 PAYLOAD_TOO_LARGE, cần thu hẹp bộ lọc. Không xuất token, hash, OTP. Các ô được chống CSV formula injection.'
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: role, in: query, schema: { type: string, enum: [BUYER, ADMIN] } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, LOCKED, UNVERIFIED, DELETED] } }
      responses:
        '200':
          description: Tệp CSV
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Quá giới hạn xuất dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [Admin Accounts]
      summary: Tìm và lọc tài khoản
      description: 'Chỉ ADMIN. Phân trang theo ID giảm dần; không trả mật khẩu, token hoặc Google subject. Lỗi: 400 VALIDATION_ERROR khi cursor sai; 401 UNAUTHORIZED; 403 FORBIDDEN.'
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: role, in: query, schema: { type: string, enum: [BUYER, ADMIN] } }
        - { name: status, in: query, schema: { type: string, enum: [UNVERIFIED, ACTIVE, LOCKED, DELETED] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, name], default: newest } }
      responses:
        '200':
          description: Trang tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{user_id}:
    get:
      operationId: adminGetUser
      tags: [Admin Accounts]
      summary: Xem tài khoản
      description: 'Chỉ ADMIN. Trả thông tin tài khoản không có bí mật xác thực. Lỗi: 404 NOT_FOUND khi ID không tồn tại; 401 UNAUTHORIZED; 403 FORBIDDEN.'
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminUpdateUser
      tags: [Admin Accounts]
      summary: Đổi quyền hoặc khóa/mở khóa tài khoản
      description: |
        Chỉ ADMIN. Gửi role và/hoặc locked, kèm reason bắt buộc. locked=true là khóa quản trị không tự hết hạn;
        locked=false chỉ mở tài khoản đã ACTIVE trước khi bị khóa, không xác minh tài khoản UNVERIFIED.
        Đổi quyền chỉ áp dụng tài khoản ACTIVE hoặc LOCKED. Không tự hạ quyền/tự khóa và không làm mất ADMIN ACTIVE cuối cùng.
        Tài khoản DELETED không được sửa. Cấp ADMIN yêu cầu tài khoản đã có mật khẩu vì Google login chỉ hỗ trợ BUYER.
        Khi có thay đổi, vô hiệu JWT cũ, thu hồi refresh sessions và ghi audit trong cùng transaction; người dùng đăng nhập lại.
        Gọi lại cùng trạng thái không tạo thêm thay đổi/audit. Không hỗ trợ xóa user hay sửa thông tin cá nhân qua API này.
        Lỗi: 400 VALIDATION_ERROR khi body/ràng buộc trạng thái không hợp lệ; 403 FORBIDDEN khi tự hạ quyền/tự khóa;
        404 NOT_FOUND; 409 ACTION_STATE_INVALID khi ảnh hưởng ADMIN cuối cùng; 401 UNAUTHORIZED.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountUpdate' }
      responses:
        '200':
          description: Tài khoản sau cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ACTION_STATE_INVALID - cần giữ một ADMIN hoạt động
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 409, code: ACTION_STATE_INVALID, detail: Cần giữ ít nhất một ADMIN hoạt động }
  /admin/venue-imports:
    get:
      operationId: listVenueImports
      tags: [Venue Imports]
      summary: Danh sách nháp của admin hiện tại
      description: 'Chỉ ADMIN; chỉ phiên thuộc mình, chưa hết hạn. Cursor UUID giảm dần. Lỗi 400 VALIDATION_ERROR, 401 UNAUTHORIZED, 403 FORBIDDEN.'
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách nháp DRAFT còn hạn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createVenueImport
      tags: [Venue Imports]
      summary: Tạo nháp sân hoặc layout mới
      description: 'Chỉ ADMIN. Có target_venue_id để thêm layout vào sân đang hoạt động; có overview_id để dùng nền PUBLISHED cùng sân. Nền được sao chép vào manifest nháp để preview; không được thay file nền khi vẫn dùng overview_id đó. Không tạo venue rỗng. Lỗi 400 VALIDATION_ERROR, 404 NOT_FOUND, 401 UNAUTHORIZED, 403 FORBIDDEN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueImportCreate' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Phiên DRAFT, revision hiện hành và hạn lưu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/venue-imports/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getVenueImport
      tags: [Venue Imports]
      summary: Mở lại nháp hoặc kết quả đã hoàn tất
      description: 'Chỉ ADMIN sở hữu phiên. Hết hạn hoặc khác chủ trả 404 NOT_FOUND; 401 UNAUTHORIZED, 403 FORBIDDEN nếu không có quyền quản trị.'
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Metadata, manifest file và kết quả; không trả bytes nguồn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportSession' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateVenueImport
      tags: [Venue Imports]
      summary: Lưu dữ liệu wizard với revision
      description: 'Chỉ ADMIN sở hữu phiên. draft_data thay thế toàn bộ cấu hình do client quản lý; overview_id chọn khi tạo không đổi. Mỗi thay đổi tăng revision. Lỗi 409 ACTION_STATE_INVALID khi revision cũ/phiên đóng; 400 VALIDATION_ERROR; 404 NOT_FOUND.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueImportPatch' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Nháp đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
  /admin/venue-imports/{session_id}/files:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: uploadVenueImportFiles
      tags: [Venue Imports]
      summary: Upload và tự phân loại SVG
      description: |
        Chỉ ADMIN sở hữu nháp. Tối đa 10 MiB mỗi request/file nguồn, 32 file và 40 MiB nguồn mỗi phiên;
        chọn nhiều file có thể upload nhiều request. Nguồn trùng checksum không ghi trùng.
        Backend nhận OVERVIEW hoặc SEAT_LAYOUT theo DOM. SVG sai hoặc không nhận diện được trả
        422 INVALID_SEAT_LAYOUT kèm issues; toàn bộ request bị từ chối. File gộp phải xuất tách lớp.
        Lỗi 413 PAYLOAD_TOO_LARGE, 415 UNSUPPORTED_MEDIA_TYPE, 409 ACTION_STATE_INVALID,
        400 VALIDATION_ERROR cho manifest/nhóm file sai; 404 NOT_FOUND.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [revision, files]
              properties:
                revision: { type: integer, format: int64, minimum: 0 }
                files: { type: array, minItems: 1, maxItems: 32, items: { type: string, format: binary } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Nháp với các file đã kiểm tra và revision hiện hành
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '413': { $ref: '#/components/responses/ImportTooLarge' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE - chỉ nhận image/svg+xml
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { status: 415, code: UNSUPPORTED_MEDIA_TYPE, detail: Chỉ nhận image/svg+xml }
        '422':
          description: SVG không hợp lệ hoặc không nhận diện được vai trò (INVALID_SEAT_LAYOUT).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/SeatLayoutImportProblem' }
  /admin/venue-imports/{session_id}/files/{file_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: file_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteVenueImportFile
      tags: [Venue Imports]
      summary: Bỏ file khỏi nháp
      description: 'Chỉ ADMIN sở hữu phiên; file phải thuộc phiên. Lỗi 409 ACTION_STATE_INVALID khi revision cũ/đã đóng; 404 NOT_FOUND.'
      parameters:
        - { name: revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Manifest và revision mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
  /admin/venue-imports/{session_id}/preview:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewVenueImport
      tags: [Venue Imports]
      summary: Ghép nhiều SVG và kiểm tra hình học
      description: 'Chỉ ADMIN sở hữu nháp. Một overview, ít nhất một detail, cùng viewBox; kiểm tra ID trùng, tọa độ, mapping AREA, zone/ghế và cổng. Zone lấy hợp fill của tất cả path/use sau transform, winding và mask; kiểm tra tâm ghế trên vùng hợp được khép khe bằng phép giãn/co bán kính 0.005 đơn vị viewBox. Diện tích ghế ngoài hình zone gốc vẫn phải đạt min(0.025 đơn vị viewBox², 1% diện tích ghế). Không nới collision ghế–cổng hoặc ghế–ghế. Trả valid=false cùng issues để sửa, không tạo venue/layout; revision không đổi. Lỗi 409 ACTION_STATE_INVALID nếu dữ liệu đổi; 404 NOT_FOUND.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRevision' }
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Preview an toàn và kết quả kiểm tra
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
  /admin/venue-imports/{session_id}/complete:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeVenueImport
      tags: [Venue Imports]
      summary: Lưu nguyên tử sân/nền/layout DRAFT
      description: 'Chỉ ADMIN sở hữu nháp. Kiểm tra lại SVG/mapping, tên/loại layout và thông tin sân. Tạo tất cả dữ liệu và ghi kết quả session trong một transaction. Retry phiên COMPLETED trả cùng IDs, không tạo lại dù revision cũ. Không nhận validation_hash từ client. Lỗi 422 INVALID_SEAT_LAYOUT kèm issues; 400 VALIDATION_ERROR thiếu metadata; 409 ACTION_STATE_INVALID revision cũ/đã hủy; 404 NOT_FOUND.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRevision' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Cùng kết quả hoàn tất, idempotent theo session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '422':
          description: INVALID_SEAT_LAYOUT - sửa theo issues của preview
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/SeatLayoutImportProblem' }
  /admin/venue-imports/{session_id}/cancel:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelVenueImport
      tags: [Venue Imports]
      summary: Hủy nháp
      description: 'Chỉ ADMIN sở hữu phiên; giữ 7 ngày để cleanup. Retry CANCELLED trả trạng thái cũ. Lỗi 409 ACTION_STATE_INVALID khi revision cũ/đã hoàn tất; 404 NOT_FOUND.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRevision' }
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Phiên CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueImportSession' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
  /admin/venues/{venue_id}/overviews:
    get:
      operationId: listVenueOverviews
      tags: [Venue Imports]
      summary: Danh sách phiên bản nền của sân
      description: 'Chỉ ADMIN; sân phải hoạt động. Phân trang ID giảm dần; lỗi 400 VALIDATION_ERROR hoặc 404 NOT_FOUND.'
      parameters:
        - { name: venue_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Các phiên bản nền
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueOverviewPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/venue-overviews/{overview_id}:
    get:
      operationId: getVenueOverview
      tags: [Venue Imports]
      summary: Chi tiết nền và cổng/vùng
      description: 'Chỉ ADMIN. Trả SVG đã kiểm tra cùng cổng/vùng; lỗi 404 NOT_FOUND nếu sân/nền không tồn tại hoặc sân đã ngừng dùng.'
      parameters:
        - { name: overview_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Chi tiết nền
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueOverview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/venues:
    get:
      operationId: listVenues
      tags: [Admin Catalog]
      summary: Tìm / lọc sân
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createVenue
      tags: [Admin Catalog]
      summary: Tạo sân
      description: Admin cung cấp name, address và city để tạo sân.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueCreateInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /admin/venues/{venue_id}:
    get:
      operationId: getAdminVenue
      tags: [Admin Catalog]
      summary: Chi tiết sân dành cho quản trị
      description: 'Chỉ ADMIN. Trả địa chỉ và tọa độ, ngày tạo/cập nhật và số sơ đồ. Lỗi 404 NOT_FOUND khi sân đã ngừng dùng hoặc không tồn tại.'
      responses:
        '200':
          description: Thông tin sân
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    parameters: [ { $ref: '#/components/parameters/VenueId' } ]
    patch:
      operationId: updateVenue
      tags: [Admin Catalog]
      summary: Sửa sân
      description: Cập nhật các trường được gửi của sân đang hoạt động. Trả 400 VALIDATION_ERROR khi dữ liệu không hợp lệ, 404 NOT_FOUND khi sân không tồn tại hoặc đã ngừng sử dụng.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteVenue
      tags: [Admin Catalog]
      summary: Ngừng sử dụng sân (soft-delete)
      description: Ngừng sử dụng sân bằng xóa mềm. Trả 404 NOT_FOUND nếu sân không tồn tại hoặc đã bị xóa; trả 409 VENUE_IN_USE nếu còn suất DRAFT hoặc SCHEDULED chưa kết thúc.
      responses:
        '204': { description: Đã ẩn }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sân còn suất chưa kết thúc (VENUE_IN_USE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Sân đang được sử dụng
                status: 409
                code: VENUE_IN_USE
                detail: Sân còn suất diễn DRAFT hoặc SCHEDULED chưa kết thúc.
  /admin/venues/{venue_id}/layout-tree:
    get:
      operationId: getAdminLayoutTree
      tags: [Admin Workspace]
      summary: Cây phiên bản sơ đồ theo loại
      description: 'Chỉ ADMIN. Chọn FOOTBALL hoặc CONCERT để lấy đúng loại layout của sân, theo phiên bản giảm dần. Cây không phụ thuộc file nhập tạm; tải ghế qua API chi tiết zone hiện có. Không cho sửa hình học. Lỗi 400 VALIDATION_ERROR hoặc 404 NOT_FOUND.'
      parameters:
        - { name: venue_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: layout_type, in: query, required: true, schema: { $ref: '#/components/schemas/LayoutType' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cây phiên bản của loại layout được chọn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLayoutTree' }
              example: { venue_id: '019a0000-0000-7000-8000-000000000001', layout_type: FOOTBALL, data: [], next_cursor: null }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/venues/{venue_id}/seat-layouts:
    get:
      operationId: listSeatLayouts
      tags: [Admin Catalog]
      summary: Liệt kê phiên bản sơ đồ của sân
      description: Trả tên và phiên bản sơ đồ của sân, mới nhất trước. Chọn bằng id cụ thể khi tạo suất, không tự lấy bản mới nhất.
      parameters:
        - name: venue_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: layout_type, in: query, schema: { $ref: '#/components/schemas/LayoutType' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách phiên bản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayoutPage' }
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Dữ liệu không hợp lệ
                status: 400
                code: VALIDATION_ERROR
                detail: Cursor sơ đồ không hợp lệ. Hãy tải lại trang đầu và dùng next_cursor do API trả về.
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy sân đang hoạt động. Hãy chọn lại sân.
  /admin/seat-layouts/{layout_id}:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSeatLayout
      tags: [Admin Catalog]
      summary: Đọc tổng quan sơ đồ sân
      description: Trả tên cấu hình, thông tin phiên bản, hệ tọa độ và danh sách khu để dựng bản đồ và mini map.
      responses:
        '200':
          description: Tổng quan sơ đồ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayoutOverview' }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy phiên bản sơ đồ sân. Hãy tải lại danh sách sơ đồ của sân.

  /admin/seat-layouts/{layout_id}/svg:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSeatLayoutSvg
      tags: [Admin Catalog]
      summary: Đọc SVG toàn sân
      description: Trả SVG đã chuẩn hóa của phiên bản. Layout không có SVG trả 404.
      responses:
        '200':
          description: Nội dung SVG
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy SVG của phiên bản sơ đồ. Hãy chọn phiên bản đã nhập từ SVG.

  /admin/seat-layouts/{layout_id}/zones/{zone_id}:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: zone_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSeatLayoutZone
      tags: [Admin Catalog]
      summary: Đọc chi tiết khu
      description: Trả hàng ghế hoặc sức chứa. Khu phải thuộc đúng phiên bản trong URL.
      responses:
        '200':
          description: Chi tiết khu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayoutZoneDetail' }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy khu trong phiên bản sơ đồ đã chọn. Hãy lấy zone_id từ tổng quan của layout này.

  /admin/seat-layouts/{layout_id}/zones.csv:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportSeatLayoutZones
      tags: [Admin Catalog]
      summary: Tải danh sách khu dưới dạng CSV
      description: Xuất CSV UTF-8 với các cột zone_code, label, stand_code, level, kind, capacity, svg_id.
      responses:
        '200':
          description: Danh sách khu
          content:
