        overview_id: { type: string, format: uuid }
    VenueImportDraft:
      type: object
      properties:
        venue: { $ref: '#/components/schemas/VenueInput' }
        overview_id: { type: string, format: uuid, readOnly: true }
        overview_name: { type: string, maxLength: 200 }
        file_layout_types:
          type: object
          description: Loại layout theo ID file zone/ghế. Các file cùng loại tạo một layout.
          additionalProperties: { $ref: '#/components/schemas/LayoutType' }
        layout_name: { type: string, maxLength: 200 }
        layout_type: { $ref: '#/components/schemas/LayoutType' }
        zone_areas:
          type: object
          additionalProperties: { type: string }
          description: Mã zone tới mã AREA; nếu không gửi thì suy ra khi chỉ có một vùng chứa hợp lệ.
    VenueImportPatch:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        step: { type: string, enum: [OVERVIEW, LAYOUT, PREVIEW, DETAILS, REVIEW] }
        draft_data: { $ref: '#/components/schemas/VenueImportDraft' }
    VenueImportIssue:
      type: object
      required: [reason, message]
      properties:
        reason: { type: string }
        message: { type: string }
        layer_id: { type: string }
        gate_id: { type: string }
        zone_id: { type: string }
        file_id: { type: string, format: uuid }
        intersection_area:
          type: number
          description: Diện tích va chạm hoặc diện tích ghế nằm ngoài zone với SEAT_OUTSIDE_ZONE, tính bằng đơn vị viewBox².
        tolerance:
          type: number
          description: 'Ngưỡng diện tích được phép; SEAT_OUTSIDE_ZONE dùng min(0.025 đơn vị viewBox², 1% diện tích ghế) trên zone gốc. Tâm ghế kiểm tra trên hợp fill toàn bộ zone sau khi khép khe bằng phép giãn/co bán kính 0.005 đơn vị viewBox.'
    VenueImportFile:
      type: object
      properties:
        id: { type: string, format: uuid }
        original_filename: { type: string }
        role: { type: string, enum: [OVERVIEW, SEAT_LAYOUT] }
        validation_status: { type: string, enum: [UPLOADED, VALIDATED, INVALID] }
        size_bytes: { type: integer }
        checksum: { type: string }
        schema_version: { type: integer }
        sanitized_svg: { type: [string, 'null'] }
        issues: { type: array, items: { $ref: '#/components/schemas/VenueImportIssue' } }
    VenueImportSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        target_venue_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [DRAFT, COMPLETED, CANCELLED] }
        step: { type: string, enum: [OVERVIEW, LAYOUT, PREVIEW, DETAILS, REVIEW] }
        revision: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time }
        draft_data: { $ref: '#/components/schemas/VenueImportDraft' }
        files: { type: array, items: { $ref: '#/components/schemas/VenueImportFile' } }
        result: { $ref: '#/components/schemas/VenueImportResult' }
    VenueImportResult:
      type: object
      required: [venue_id, overview_id, layout_id]
      properties:
        venue_id: { type: string, format: uuid }
        overview_id: { type: string, format: uuid }
        layout_id: { type: string, format: uuid }
    VenueImportPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VenueImportSession' } }
        next_cursor: { type: [string, 'null'] }
    OverviewGate:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        svg_id: { type: string }
        direction: { type: string, enum: [IN, OUT, BOTH] }
    OverviewArea:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        svg_id: { type: string }
    VenueOverview:
      type: object
      properties:
        id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
