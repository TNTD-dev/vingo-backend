          required: [zones]
          properties:
            view_box: { $ref: '#/components/schemas/SeatLayoutBounds' }
            zones:
              type: array
              items: { $ref: '#/components/schemas/SeatLayoutZone' }

    SeatLayoutPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/SeatLayout' }
    AdminEventSummary:
      type: object
      required: [id, title, category, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/EventCategory'
        status:
          $ref: '#/components/schemas/EventStatus'
        poster_mobile_url:
          type: string
          format: uri
        poster_desktop_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminEventPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminEventSummary'
        next_cursor:
          type: [string, 'null']
          description: Cursor trang tiếp theo; null khi hết dữ liệu.
    EventInput:
      type: object
      properties:
        seat_layout_id: { type: string, format: uuid, description: Sơ đồ ghế (seat_map) cùng loại với sự kiện. }
        title:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
        description:
          type: string
        category:
          $ref: '#/components/schemas/EventCategory'
        home_team: { type: [string, 'null'] }
        away_team: { type: [string, 'null'] }
        league: { type: [string, 'null'] }
        round: { type: [string, 'null'] }
        poster_mobile_url:
          type: string
          format: uri
          description: URL tuyệt đối HTTP hoặc HTTPS của poster mobile.
        poster_desktop_url:
          type: string
          format: uri
          description: URL tuyệt đối HTTP hoặc HTTPS của poster desktop.
        max_tickets_per_order:
          type: integer
          minimum: 1
          maximum: 20
    EventPatchInput:
      type: object
      description: Không có default. Thuộc tính không gửi hoặc null được giữ nguyên; không hỗ trợ xóa giá trị bằng null.
      properties:
        seat_layout_id: { type: string, format: uuid, description: Sơ đồ ghế (seat_map) cùng loại với sự kiện. }
        title:
          type: [string, 'null']
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
          pattern: '^(FOOTBALL|CONCERT)$'
          description: FOOTBALL hoặc CONCERT; null giữ nguyên.
        home_team: { type: [string, 'null'] }
        away_team: { type: [string, 'null'] }
        league: { type: [string, 'null'] }
        round: { type: [string, 'null'] }
        poster_mobile_url:
          type: [string, 'null']
          format: uri
          description: URL tuyệt đối HTTP/HTTPS có host; null giữ nguyên.
        poster_desktop_url:
          type: [string, 'null']
          format: uri
          description: URL tuyệt đối HTTP/HTTPS có host; null giữ nguyên.
        max_tickets_per_order:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
    EventCreateInput:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [title, category]
          properties:
            max_tickets_per_order:
              type: integer
              minimum: 1
              maximum: 20
              default: 10
    EventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: '#/components/schemas/EventCategory' }
        poster_url: { type: string, format: uri }
        venue_name: { type: string }
        city: { type: string, maxLength: 100 }
        city_name: { type: string, description: Tên hiển thị của thành phố }
        first_starts_at: { type: string, format: date-time }
        price_from: { type: integer, format: int64 }
        on_sale: { type: boolean }
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/EventStatus' }
            venue: { $ref: '#/components/schemas/Venue' }
            zone_prices:
              type: array
              description: Cấu hình khu lưu trên server, chỉ trả ở API quản trị.
              items: { $ref: '#/components/schemas/ZonePriceInput' }
            price_tiers:
              type: array
              items: { $ref: '#/components/schemas/PriceTier' }
            showtimes:
              type: array
              items: { $ref: '#/components/schemas/Showtime' }
    PriceTierInput:
      type: object
      required: [name, price]
      properties:
        id:
          type: string
          format: uuid
          description: >
            ID hạng giá hiện có của sự kiện khi cập nhật.
            Nếu không gửi, dùng lại hạng cùng tên sau khi bỏ
            khoảng trắng hoặc tạo mới nếu chưa có.
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*\S[\s\S]*'
          example: VIP
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 4611686018427387
          description: Giá một vé, đơn vị VND.
          example: 500000
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#C8A2C8'

    ZonePriceInput:
      type: object
      required: [zone_id, price_tier_id]
      properties:
        zone_id:
          type: string
          format: uuid
          description: Khu thuộc layout của sự kiện; dữ liệu cũ dùng layout từ các suất chưa hủy.
        display_name: { type: string, minLength: 1, maxLength: 200, description: Tên khu riêng của sự kiện. Bỏ trống để dùng tên gốc. }
        price_tier_id:
          type: string
          format: uuid
          description: Hạng giá thuộc đúng sự kiện.
    SkuPriceInput:
      type: object
      required: [price]
      properties:
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 4611686018427387
          description: Giá mới (VND).
        effective_from:
          type: [string, 'null']
          format: date-time
          description: Thời điểm hiệu lực (UTC). Bỏ trống = có hiệu lực ngay.
        reason:
          type: [string, 'null']
          maxLength: 500
    SkuPrice:
      type: object
      required: [id, sku_id, price, effective_from, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        sku_id: { type: string, format: uuid }
        price: { type: integer, format: int64, minimum: 0, maximum: 4611686018427387 }
        effective_from: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    PriceTier:
      type: object
      required: [name, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer, format: int64, minimum: 0, description: Giá hiện hành tại thời điểm đọc }
        color: { type: string, example: '#C8A2C8' }
        prices:
          type: array
          description: Lịch sử và lịch hẹn đổi giá (chỉ trả ở API quản trị).
          items: { $ref: '#/components/schemas/SkuPrice' }
    ShowtimeInput:
      type: object
      properties:
        seat_layout_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        sale_opens_at: { type: string, format: date-time }
        sale_closes_at: { type: string, format: date-time }
    Showtime:
      allOf:
        - $ref: '#/components/schemas/ShowtimeInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ShowtimeStatus' }
            cancelled_at: { type: [string, 'null'], format: date-time }
            sold_out: { type: boolean }
            venue: { $ref: '#/components/schemas/Venue' }
    SeatMap:
      type: object
      properties:
        showtime_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ShowtimeStatus' }
        zones:
          type: array
          items:
            type: object
            properties:
              zone_id: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string, enum: [SEATED, STANDING] }
              tier: { $ref: '#/components/schemas/PriceTier' }
              seats_left: { type: integer, description: Chỉ với STANDING }
              seats:
                type: array
                items:
                  type: object
                  properties:
                    seat_id: { type: string, format: uuid }
                    row: { type: string }
                    number: { type: integer }
                    seat_type: { type: string, enum: [STANDARD, COUPLE, WHEELCHAIR] }
                    pair_seat_id: { type: [string, 'null'], format: uuid }
                    status: { $ref: '#/components/schemas/SeatStatus' }
                    x: { type: number }
                    y: { type: number }

    HoldRequest:
      type: object
      description: |
        Gửi đúng một trong hai dạng: seat_ids cho khu ngồi hoặc zone_id + quantity cho khu đứng.
        Gửi cả hai dạng, không gửi dạng nào, zone_id thiếu quantity hoặc quantity thiếu zone_id → 400 VALIDATION_ERROR.
        seat_ids nếu gửi thì không được rỗng; service kiểm tra, rỗng → 400 VALIDATION_ERROR.
        Ghế đôi tự giữ kèm ghế cặp.
      properties:
        seat_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 20 }
      example:
        seat_ids: ['019a71b0-0000-7000-8000-000000000001']
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        zone: { type: string }
        row: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        seat_id: { type: [string, 'null'], format: uuid }
        tier: { type: string }
        unit_price: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, description: 'Số vé của dòng: ghế ngồi luôn 1, khu đứng là số chỗ đã giữ' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: 8F3K2Q }
        status: { $ref: '#/components/schemas/OrderStatus' }
        event: { $ref: '#/components/schemas/EventSummary' }
        showtime: { $ref: '#/components/schemas/Showtime' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        total_amount: { type: integer, format: int64 }
        currency: { type: string, const: VND }
        expires_at: { type: string, format: date-time, description: Hạn giữ ghế khi PENDING }
        paid_at: { type: [string, 'null'], format: date-time }
        buyer: { $ref: '#/components/schemas/Buyer' }
        review_reason: { type: [string, 'null'], enum: [PAID_AFTER_EXPIRY, PAID_AFTER_CANCEL, AMOUNT_MISMATCH, PAYMENT_SUSPECTED, null] }
        created_at: { type: string, format: date-time }
    AdminUserStatistics:
      type: object
      required: [total, active, locked, unverified, deleted]
      properties:
        total: { type: integer, format: int64 }
        active: { type: integer, format: int64 }
        locked: { type: integer, format: int64 }
        unverified: { type: integer, format: int64 }
        deleted: { type: integer, format: int64 }
    AdminAccount:
      type: object
      required: [id, email, full_name, role, status, admin_locked, has_password, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        phone: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        full_name: { type: string }
        role: { type: string, enum: [BUYER, ADMIN] }
        status: { type: string, enum: [UNVERIFIED, ACTIVE, LOCKED, DELETED], description: Trạng thái suy ra tại thời điểm đọc }
        email_verified_at: { type: [string, 'null'], format: date-time }
        admin_locked: { type: boolean }
        has_password: { type: boolean }
        locked_until: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    AdminAccountPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminAccount' }
        next_cursor: { type: [string, 'null'] }
    AdminAccountUpdate:
      type: object
      required: [reason]
      properties:
        role: { type: string, enum: [BUYER, ADMIN] }
        locked: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 500, pattern: '[\s\S]*\S[\s\S]*' }
    PaymentIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        txn_ref: { type: string, example: 8F3K2Q-1 }
        amount: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        payment_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        last_response_code: { type: [string, 'null'] }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'Mã ngắn để tra cứu, không dùng vào cổng' }
        status: { $ref: '#/components/schemas/TicketStatus' }
        qr_token: { type: [string, 'null'], description: Chỉ trả khi ISSUED và người gọi là chủ vé }
        order_code: { type: string }
        event: { $ref: '#/components/schemas/EventSummary' }
        showtime: { $ref: '#/components/schemas/Showtime' }
        venue: { $ref: '#/components/schemas/Venue' }
        zone: { type: string }
        row: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        tier: { type: string }
        used_at: { type: [string, 'null'], format: date-time }
    CheckinResult:
      type: object
      properties:
        result: { type: string, enum: [OK, ALREADY_USED, TICKET_VOID, WRONG_SHOWTIME, INVALID_QR] }
        ticket_code: { type: [string, 'null'] }
        zone: { type: [string, 'null'] }
        row: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        scanned_at: { type: string, format: date-time }
        first_used_at: { type: [string, 'null'], format: date-time, description: Khi ALREADY_USED }

    StreamEvent:
      type: object
      description: Một sự kiện SSE (dòng event + data JSON)
      properties:
        event:
          type: string
          enum: [order.held, order.paid, order.expired, order.needs_review, payment.failed, ticket.issued]
        id: { type: string }
        data: { type: object }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_name: { type: string }
        actor_id: { type: string, format: uuid }
        action: { type: string, enum: [VOID_TICKET, REISSUE_QR, RESEND_TICKET, RESOLVE_REVIEW, BLOCK_SEATS, UNBLOCK_SEATS, CANCEL_EVENT, CANCEL_SHOWTIME, UPDATE_ACCOUNT, ADMIN_ACTIVITY] }
        entity: { type: string }
        entity_id: { type: string, format: uuid }
        reason: { type: string }
        via_agent: { type: boolean, description: Thao tác do Admin Copilot thực hiện sau khi được duyệt }
        at: { type: string, format: date-time }
        before: { type: [object, 'null'], description: Trạng thái liên quan trước thao tác }
        after: { type: [object, 'null'], description: Trạng thái liên quan sau thao tác }
    AdminDashboard:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        computed_at: { type: string, format: date-time }
        timezone: { type: string }
        current: { $ref: '#/components/schemas/AdminDashboardKpis' }
        previous: { $ref: '#/components/schemas/AdminDashboardKpis' }
        on_sale_showtimes: { type: integer, format: int64 }
        revenue: { $ref: '#/components/schemas/MetricResult' }
        tickets: { $ref: '#/components/schemas/MetricResult' }
        tiers: { $ref: '#/components/schemas/MetricResult' }
        upcoming:
          type: array
          items: { $ref: '#/components/schemas/AdminDashboardShowtime' }
        venues:
          type: array
          items: { $ref: '#/components/schemas/AdminDashboardVenue' }
    AdminDashboardKpis:
      type: object
      properties:
        revenue: { type: number }
        tickets_sold: { type: number }
        new_users: { type: integer, format: int64 }
    AdminDashboardShowtime:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        title: { type: string }
        venue_name: { type: string }
        starts_at: { type: string, format: date-time }
        sold: { type: integer, format: int64 }
        capacity: { type: integer, format: int64 }
        on_sale: { type: boolean }
    AdminDashboardVenue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sold: { type: integer, format: int64 }
        capacity: { type: integer, format: int64 }
    MetricResult:
      type: object
      properties:
        metric: { type: string }
        unit: { type: string, enum: [tickets, VND, percent, checkins] }
        filters: { type: object, description: 'Bộ lọc đã áp dụng, để hiển thị cho admin' }
        computed_at: { type: string, format: date-time }
        value: { type: number, description: Khi group_by = none }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: number }
        definition: { type: string, description: 'Cách tính, ví dụ fill_rate = sold / capacity' }

    LocationSuggestion:
      type: object
      required: [label, address, lat, lng]
      properties:
        label: { type: string, maxLength: 500 }
        address: { type: string, maxLength: 500 }
        city: { type: string, maxLength: 100 }
        district: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
