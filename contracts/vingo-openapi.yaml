        areas: { type: array, items: { $ref: '#/components/schemas/OverviewArea' } }
        created_at: { type: string, format: date-time }
    VenueOverviewPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/VenueOverview' } }
        next_cursor: { type: [string, 'null'] }
    VenueImportZonePreview:
      type: object
      description: Zone trước khi lưu; chưa có UUID bản ghi DB. Dùng code/svg_id để tương tác preview.
      required: [code, label, kind, capacity, seat_count, svg_id, bounds]
      properties:
        code: { type: string }
        label: { type: string }
        kind: { type: string, enum: [SEATED, STANDING] }
        capacity: { type: integer, minimum: 0 }
        seat_count: { type: integer, minimum: 0 }
        svg_id: { type: string }
        content_svg_id: { type: string }
        pitch_side_svg_id: { type: string }
        bounds: { $ref: '#/components/schemas/SeatLayoutBounds' }

    VenueImportPreview:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        revision: { type: integer, format: int64 }
        valid: { type: boolean }
        overview_svg: { type: [string, 'null'] }
        detail_svg: { type: [string, 'null'] }
        zones: { type: array, items: { $ref: '#/components/schemas/VenueImportZonePreview' } }
        gates: { type: array, items: { $ref: '#/components/schemas/OverviewGate' } }
        areas: { type: array, items: { $ref: '#/components/schemas/OverviewArea' } }
        zone_areas: { type: object, additionalProperties: { type: string } }
        issues: { type: array, items: { $ref: '#/components/schemas/VenueImportIssue' } }
    AdminLayoutTree:
      type: object
