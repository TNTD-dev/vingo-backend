vingo:
  # Giá trị chung cho mọi test, để test không phải tự đặt @TestPropertySource
  # (mỗi bộ property khác nhau là Spring dựng thêm một context, làm CI chậm).
  google:
    enabled: false
  sms:
    # Cố định provider cho test: biến môi trường SMS_PROVIDER=demo trên máy/CI không được làm hỏng các test dùng RecordingSmsSender. DemoOtpApiTest tự ghi đè bằng @TestPropertySource.
    provider: speedsms
  auth:
    secure-cookies: false
    phone-otp:
      resend-cooldown: PT60S
      user-max-per-window: 5
      phone-max-per-window: 5
      ip-max-per-window: 20
      window: PT24H
    login:
      max-attempts: 3
      # Ghi rõ để biến môi trường AUTH_LOGIN_* trên máy chạy test không ghi đè được.
      attempt-window: PT15M
      lock-duration: PT15M
  jwt:
    secret: test-secret-for-integration-tests-only-32b
  qr:
    secret: test-qr-secret-for-integration-tests-only-32b
  realtime:
    heartbeat: PT1S
  search:
    rate-limit:
      # Đủ lớn để test thường không chạm giới hạn; test rate limit tự đặt giá trị nhỏ.
      per-minute: 100000
  vnpay:
    tmn-code: TESTTMN1
    hash-secret: test-vnpay-secret-only-for-tests
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    api-url: http://vnpay.invalid/querydr
    return-url: http://localhost:8080/api/v1/payments/vnpay/return
    frontend-return-url: http://localhost:5173/payment/result
server:
  tomcat:
    # Test tranh chấp gửi đồng thời 1.000 request; hàng đợi phải chứa đủ đợt kết nối.
    accept-count: 2048
spring:
  flyway:
    placeholders:
      allowDestructiveReset: true
    locations: classpath:db/migration
