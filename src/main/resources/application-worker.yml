# Profile worker: không mở cổng HTTP, chạy job nền (@Scheduled + ShedLock, xem WorkerConfig).
spring:
  main:
    web-application-type: none
    # Virtual threads bật thì thread của @Scheduled là daemon; không có web server
    # giữ JVM nên tiến trình tự thoát (exit 0) ngay sau khi khởi động. Giữ JVM sống.
    keep-alive: true
  flyway:
    # Migration do api chạy trước khi nhận request; worker chỉ kiểm tra.
    enabled: false

vingo:
  jobs:
    expire-holds: PT5S
    reconcile-payments: PT1M
    outbox-sender: PT2S
    realtime-gc: PT1M
