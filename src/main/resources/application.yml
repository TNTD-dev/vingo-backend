# Cấu hình chung cho mọi profile. Secret chỉ đọc từ biến môi trường.
spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: vingo-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vingo}
    username: ${DB_USER:vingo}
    password: ${DB_PASSWORD:vingo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    placeholders:
      allowDestructiveReset: false
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # Redis chỉ là cache/rate limit, chậm thì bỏ qua để không làm chậm bán vé.
      timeout: 200ms
      connect-timeout: 200ms
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Mọi profile kế thừa giới hạn này; request dành thêm 1 MiB cho multipart headers.
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful

vingo:
  qr:
    secret: ${QR_SECRET:}
  hold:
    ttl: PT10M
    # Chống giữ lại cùng ghế liên tục mà không thanh toán: giữ rồi nhả (hết hạn hoặc huỷ) đủ rehold-max lần
    # trong rehold-window thì phải chờ rehold-cooldown kể từ lần nhả gần nhất.
    rehold-max: 3
    rehold-window: PT1H
    rehold-cooldown: PT10M
  realtime:
    replay-window: PT5M
    replay-overlap: PT10S
    retention: PT10M
    heartbeat: PT20S
    max-connections-per-user: 5
    queue-capacity: 1000
  search:
    rate-limit:
      # Số request mỗi phút cho mỗi IP, dùng chung cho cả 5 endpoint search.
      per-minute: ${SEARCH_RATE_LIMIT_PER_MINUTE:120}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
    frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/payment/result}
  google:
    enabled: ${GOOGLE_LOGIN_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/google}
    rate-limit-per-minute: ${GOOGLE_LOGIN_RATE_LIMIT_PER_MINUTE:10}
  venue-lookup:
    google-api-key: ${GOOGLE_MAPS_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
  auth:
    frontend-return-url: ${AUTH_FRONTEND_RETURN_URL:http://localhost:3000/auth/google}
    secure-cookies: ${AUTH_SECURE_COOKIES:true}
    session-ttl: ${AUTH_SESSION_TTL:P7D}
    stream-max: ${AUTH_STREAM_MAX:PT15M}
    login:
      max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
      attempt-window: ${AUTH_LOGIN_ATTEMPT_WINDOW:PT15M}
      lock-duration: ${AUTH_LOGIN_LOCK_DURATION:PT15M}
    otp:
      ttl: ${AUTH_OTP_TTL:PT5M}
      max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
      resend-cooldown: ${AUTH_OTP_RESEND_COOLDOWN:PT60S}
      resend-max-per-window: ${AUTH_OTP_RESEND_MAX:3}
      resend-window: ${AUTH_OTP_RESEND_WINDOW:PT15M}
      register-max-per-window: ${AUTH_OTP_REGISTER_MAX:10}
      register-window: ${AUTH_OTP_REGISTER_WINDOW:PT1M}
  mail:
    api-key: ${MAIL_API_KEY:}
    from: ${MAIL_FROM:no-reply@vingo.local}
    base-url: ${MAIL_BASE_URL:https://api.resend.com}
    # Địa chỉ web Vingo cho nút "Xem vé" trong email
    web-url: ${WEB_BASE_URL:http://localhost:3000}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Redis sập hệ thống vẫn bán vé: không để health đỏ vì Redis.
      enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  # App mới, traffic thấp: trace 100% request. Giảm qua env khi traffic tăng.
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:1.0}
  send-default-pii: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
