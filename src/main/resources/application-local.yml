# Profile local: máy dev. Đọc .env.local, log dạng dễ đọc.
spring:
  flyway:
    placeholders:
      allowDestructiveReset: true
  config:
    import: optional:file:.env.local[.properties]
logging:
  structured:
    format:
      console: ""
  level:
    vingo: DEBUG
vingo:
  auth:
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
  qr:
    secret: ${QR_SECRET:local-dev-qr-secret-change-me-at-least-32b}
sentry:
  environment: local
vingo.agent:
  url: ${AGENT_URL:http://127.0.0.1:8090}
  service-key: ${AGENT_SERVICE_KEY:local-agent-service-key}
  key: ${VINGO_AGENT_KEY:local-vingo-agent-key}
