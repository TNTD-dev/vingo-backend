# Profile local: máy dev. Đọc .env.local, log dạng dễ đọc.
spring:
  config:
    import: optional:file:.env.local[.properties]
logging:
  structured:
    format:
      console: ""
  level:
    vingo: DEBUG
vingo:
  auth:
    secure-cookies: ${AUTH_SECURE_COOKIES:false}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes}
